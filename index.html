<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sarah Guests">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Sarah Guests</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#262923;--muted:#777d73;--line:#e8e8e1;--green:#dff1e3;--green-ink:#28643c;--yellow:#fff0ca;--yellow-ink:#80601a;--red:#fbe2df;--red-ink:#98453d;--accent:#456c52;--shadow:0 5px 22px rgba(35,45,35,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 20px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:#e5eee5;display:grid;place-items:center;color:var(--accent);font-size:21px}.brand h1{font-size:21px;letter-spacing:-.6px;margin:0;font-weight:750}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.date{font-size:12px;color:var(--muted);text-align:right}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:19px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px 15px;box-shadow:var(--shadow)}.stat strong{font-size:25px;letter-spacing:-.7px;display:block}.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:9px;margin-bottom:14px}.primary{border:0;border-radius:13px;background:var(--accent);color:white;font-weight:650;padding:13px 16px;flex:1}.secondary{border:1px solid var(--line);background:white;border-radius:13px;padding:12px 13px;color:var(--ink)}
.tabs{display:flex;gap:5px;background:#eeeee8;border-radius:13px;padding:4px;margin-bottom:14px}.tab{flex:1;border:0;border-radius:10px;padding:10px 7px;background:transparent;color:var(--muted);font-size:13px;font-weight:650}.tab.active{background:white;color:var(--ink);box-shadow:0 1px 4px #0000000c}
.searchrow{display:flex;gap:8px;margin-bottom:10px}.search{flex:1;min-width:0;border:1px solid var(--line);background:white;border-radius:12px;padding:12px 13px;outline:none}.filter{border:1px solid var(--line);background:white;border-radius:12px;padding:0 10px;color:var(--muted);max-width:45%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 2px 13px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.guest-list{display:grid;gap:10px}.guest{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.guest.tomorrow{background:#fff0ee;border-color:#f0d0cc}.guest.soon{background:#fff9e9;border-color:#f2e4bc}.guest.today{background:#fff0ee;border-color:#f0d0cc}.guest-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.guest-name{font-size:24px;font-weight:780;letter-spacing:-.6px;line-height:1.15}.hl{color:#e8710a;font-weight:800}.gname{color:var(--ink);font-weight:600}.guest-sub{font-size:13px;color:var(--muted);margin-top:6px}.pill{white-space:nowrap;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700;background:#efefeb;color:#686e65}.pill.tomorrow{background:#fbe2df;color:var(--red-ink)}.pill.soon{background:#fff0ca;color:var(--yellow-ink)}.pill.today{background:#fbe2df;color:var(--red-ink)}.notes{font-size:13px;line-height:1.45;color:#555d53;margin:12px 0 13px;white-space:pre-wrap;overflow-wrap:anywhere}.guest-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #0000000d;padding-top:11px}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#50584e}.talkedago{font-size:13px;color:var(--muted);margin-top:4px}.guest.overdue{background:#ffd5d1;border-color:#e5383b;box-shadow:0 0 0 1px #e5383b}.guest.overdue .talkedago{color:#c8102e;font-weight:700}.check input{width:19px;height:19px;accent-color:var(--accent)}.guest-buttons{display:flex;gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:12px;color:#555d53}.empty{background:white;border:1px dashed #d9dbd2;border-radius:16px;text-align:center;padding:30px 18px;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.overlay{position:fixed;inset:0;background:#18201866;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:12px}.overlay.show{display:flex}.modal{width:100%;max-width:600px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 16px 16px;padding:20px 17px calc(20px + env(safe-area-inset-bottom));box-shadow:0 15px 60px #0003}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{font-size:19px;margin:0}.close{border:0;background:#eaeae4;border-radius:50%;width:33px;height:33px;font-size:19px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:650;color:#62695f}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:12px;color:var(--ink);outline:none}.field textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;gap:9px;margin-top:17px}.form-actions button{flex:1}.danger{color:#a0443b}.bottom-note{text-align:center;color:#92968e;font-size:11px;margin-top:22px}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#263329;color:white;padding:11px 16px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.toast.show{opacity:1}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.overlay{align-items:center}.modal{border-radius:22px}.app{padding-top:30px}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><div class="logo">✳</div><div><h1>Guest Tracker</h1><p>Your daily guest overview</p></div></div>
    <div class="date" id="todayLabel"></div>
  </header>
  <section class="stats">
    <div class="stat"><strong id="totalCount">0</strong><span>Active guests</span></div>
    <div class="stat"><strong id="tomorrowCount">0</strong><span>Checking out tomorrow</span></div>
    <div class="stat"><strong id="talkedCount">0</strong><span>Talked to today</span></div>
    <div class="stat"><strong id="remainingCount">0</strong><span>Not contacted today</span></div>
  </section>
  <div class="actions"><button class="primary" id="addBtn">＋ Add guest</button><button class="secondary" id="backupBtn">↥ Backup</button><button class="secondary" id="restoreBtn">↧ Restore</button></div>
  <nav class="tabs"><button class="tab active" data-tab="active">Active guests</button><button class="tab" data-tab="archive">Archive</button></nav>
  <div class="searchrow"><input class="search" id="search" placeholder="Search name or villa…" autocomplete="off"><select class="filter" id="nationalityFilter"><option value="">All nationalities</option></select></div>
  <div class="legend"><span><i class="dot" style="background:#79b987"></i>Tomorrow</span><span><i class="dot" style="background:#e6bd5b"></i>In 2 days</span><span><i class="dot" style="background:#d77d72"></i>Today</span></div>
  <section class="guest-list" id="guestList"></section>
  <div class="bottom-note">Guest Tracker · Data stored on this device</div>
</main>
<div class="overlay" id="overlay">
  <form class="modal" id="guestForm">
    <div class="modal-top"><h2 id="formTitle">Add guest</h2><button type="button" class="close" id="closeModal">×</button></div>
    <input type="hidden" id="guestId">
    <div class="field"><label for="name">Guest name *</label><input id="name" required placeholder="e.g. Anna Zimmermann"></div>
    <div class="two">
      <div class="field"><label for="natSelect">Nationality</label><select id="natSelect"><option value="">Select…</option><option>🇩🇪</option><option>🇨🇭</option><option>🇦🇹</option><option value="__other">Other</option></select><input id="nationality" placeholder="Enter flag, e.g. 🇫🇷" style="display:none"></div>
    <div class="field"><label for="gtype">Type</label><select id="gtype"><option value="">Select…</option><option>SP</option><option>DOM</option></select></div>
      <div class="field"><label for="room">Room / Villa</label><input id="room" placeholder="e.g. 128"></div>
    </div>
    <div class="two"><div class="field"><label for="checkin">Check-in date</label><input id="checkin" type="date"></div><div class="field"><label for="checkout">Check-out date *</label><input id="checkout" type="date" required></div></div>
    <label class="check" id="yWrap" style="display:none;margin-bottom:12px"><input type="checkbox" id="talkedYesterday"> Talked yesterday</label>
    <div class="field"><label for="notes">Notes</label><textarea id="notes" placeholder="Birthday, honeymoon, preferences, description…"></textarea></div>
    <div class="form-actions"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button class="primary" type="submit">Save guest</button></div>
    <button type="button" id="deleteBtn" class="mini danger" style="display:none;margin-top:12px;width:100%">Delete guest</button>
  </form>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>
<script>
const DB_NAME='guest-tracker-sarah', STORE='guests';
let db, currentTab='active', guests=[];
const $=id=>document.getElementById(id);
const countries=['Argentina','Australia','Austria','Bahrain','Bangladesh','Belgium','Brazil','Bulgaria','Cambodia','Canada','China','Croatia','Cyprus','Czech Republic','Denmark','Egypt','Estonia','Finland','France','Germany','Greece','Hong Kong','Hungary','Iceland','India','Indonesia','Iran','Iraq','Ireland','Israel','Italy','Japan','Jordan','Kazakhstan','Kuwait','Latvia','Lebanon','Lithuania','Luxembourg','Malaysia','Maldives','Mexico','Monaco','Mongolia','Nepal','Netherlands','New Zealand','Norway','Oman','Pakistan','Philippines','Poland','Portugal','Qatar','Romania','Russia','Saudi Arabia','Serbia','Singapore','Slovakia','Slovenia','South Africa','South Korea','Spain','Sri Lanka','Sweden','Switzerland','Taiwan','Thailand','Turkey','Ukraine','United Arab Emirates','United Kingdom','United States','Vietnam'];
const FLAGS=['🇩🇪','🇨🇭','🇦🇹'];
function setNat(v){v=v||'';const sel=$('natSelect'),inp=$('nationality');inp.value=v;if(!v){sel.value='';inp.style.display='none'}else if(FLAGS.includes(v)){sel.value=v;inp.style.display='none'}else{sel.value='__other';inp.style.display='block'}}
$('natSelect').onchange=()=>{const sel=$('natSelect'),inp=$('nationality');if(sel.value==='__other'){inp.value='';inp.style.display='block';inp.focus()}else{inp.value=sel.value;inp.style.display='none'}};
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function all(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function save(g){return new Promise((res,rej)=>{let r=tx('readwrite').put(g);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function remove(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateDiff(date){const a=new Date(date+'T12:00:00'),b=new Date(localDate()+'T12:00:00');return Math.round((a-b)/86400000)}
function active(g){return dateDiff(g.checkout)>=1}
function isTalked(g){return g.lastContactDate===localDate()}
function syncDomNote(){const n=$('notes');let rest=n.value.replace(/SP UPG latest \d{2}\.\d{2}[ \t]*\n?/g,'').replace(/^\s+/,'');const co=$('checkout').value;if($('gtype').value==='DOM'&&co){const d=new Date(co+'T12:00:00');d.setDate(d.getDate()-5);const line='SP UPG latest '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');n.value=line+(rest?'\n'+rest:'')}else n.value=rest}
$('gtype').addEventListener('change',syncDomNote);$('checkout').addEventListener('change',syncDomNote);$('checkout').addEventListener('input',syncDomNote);
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return localDate(d)}
function overdue(g){if(isTalked(g))return false;const base=g.lastContactDate||g.checkin||g.createdAt;return !!base&&dateDiff(base)<=-3}
function lastTalk(g){const d=g.lastContactDate;if(!d)return overdue(g)?'<div class="talkedago">No talk yet</div>':'';if(d===localDate())return '';const diff=dateDiff(d);const t=diff===-1?'yesterday':d.slice(8,10)+'.'+d.slice(5,7);return '<div class="talkedago">Talked '+t+'</div>'}
function hl(s=''){return esc(s).replace(/SP UPG latest \d{2}\.\d{2}/g,m=>'<b>'+m+'</b>').replace(/(^|[^A-Za-z0-9])(rep|HM|BD|VIP|anni|anniversary)(?![A-Za-z0-9])/gi,'$1<span class="hl">$2</span>')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function arrivalLabel(g){const d=dateDiff(g.checkin),dm=g.checkin.slice(8,10)+'.'+g.checkin.slice(5,7);if(d>0)return 'Arrives '+dm;if(d===0)return isTalked(g)?'Arrived today':'Arrive today';if(d===-1)return 'Arrived yesterday';return 'Arrived '+dm}
function shortDate(s){return new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function dateLabel(s){if(!s)return '';return new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function status(g){let d=dateDiff(g.checkout);if(d===0)return ['today','Today'];if(d===1)return ['tomorrow','Tomorrow'];if(d===2)return ['soon','In 2 days'];return ['',dateLabel(g.checkout)]}
function render(){
 const today=new Date();$('todayLabel').textContent=today.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
 const activeGuests=guests.filter(active),talked=activeGuests.filter(isTalked).length;
 $('totalCount').textContent=activeGuests.length;$('tomorrowCount').textContent=activeGuests.filter(g=>dateDiff(g.checkout)===1).length;$('talkedCount').textContent=talked;$('remainingCount').textContent=activeGuests.length-talked;
 const q=$('search').value.trim().toLowerCase(),nat=$('nationalityFilter').value;
 let list=guests.filter(g=>currentTab==='archive'?!active(g):active(g));
 list=list.filter(g=>(!q||(g.name+' '+g.room).toLowerCase().includes(q))&&(!nat||g.nationality===nat));
 list.sort((a,b)=>{const ra=(a.room||'').trim(),rb=(b.room||'').trim();if(!ra&&rb)return 1;if(ra&&!rb)return -1;return ra.localeCompare(rb,undefined,{numeric:true})||a.name.localeCompare(b.name)});
 $('guestList').innerHTML=list.length?list.map(g=>{let [cls,label]=status(g);return `<article class="guest ${currentTab==='active'?cls:''}${currentTab==='active'&&overdue(g)?' overdue':''}"><div class="guest-head"><div><div class="guest-name">${g.room?esc(g.room):'—'}</div><div class="guest-sub"><span class="gname">${hl(g.name)}</span> · ${esc(g.nationality||'Nationality not set')}</div>${g.checkin?'<div class="guest-sub">'+arrivalLabel(g)+'</div>':''}</div><span class="pill ${cls}">${currentTab==='archive'?'Checked out':label}</span></div>${g.notes?`<div class="notes">${hl(g.notes)}</div>`:''}<div class="guest-foot">${currentTab==='active'?`<div><label class="check"><input type="checkbox" data-contact="${esc(g.id)}" ${isTalked(g)?'checked':''}> Talked today</label>${lastTalk(g)}</div>`:'<span class="guest-sub">Check-out: '+dateLabel(g.checkout)+'</span>'}<div class="guest-buttons"><button class="mini" data-edit="${esc(g.id)}">Edit</button>${currentTab==='archive'?`<button class="mini" data-restore="${esc(g.id)}">Restore</button>`:''}</div></div></article>`}).join(''):`<div class="empty"><strong>${currentTab==='archive'?'No archived guests yet':'Your guest list is empty'}</strong>${currentTab==='archive'?'Guests appear here after check-out and are deleted automatically after 3 days.':'Tap “Add guest” to create your first guest card.'}</div>`;
 document.querySelectorAll('[data-contact]').forEach(el=>el.addEventListener('change',async()=>{let g=guests.find(x=>x.id===el.dataset.contact);if(!g)return;const t=localDate();let h=(g.contactHistory||[]).filter(x=>x!==t);if(g.lastContactDate&&g.lastContactDate!==t&&!h.includes(g.lastContactDate))h.push(g.lastContactDate);if(el.checked)h.push(t);h.sort();g.contactHistory=h;g.lastContactDate=h.length?h[h.length-1]:null;await save(g);await refresh()}));
 document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>editGuest(el.dataset.edit)));
 document.querySelectorAll('[data-restore]').forEach(el=>el.addEventListener('click',async()=>{let g=guests.find(x=>x.id===el.dataset.restore);g.checkout=localDate(new Date(Date.now()+86400000));await save(g);await refresh();toast('Guest restored')}));
 const opts=[...new Set(guests.map(g=>g.nationality).filter(Boolean))].sort();let old=$('nationalityFilter').value;$('nationalityFilter').innerHTML='<option value="">All nationalities</option>'+opts.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');$('nationalityFilter').value=opts.includes(old)?old:'';
}
const ARCHIVE_DAYS=3;
async function purgeOld(){let list=await all();for(const g of list){if(g.checkout&&dateDiff(g.checkout)<=-ARCHIVE_DAYS)await remove(g.id)}}
async function refresh(){await purgeOld();guests=await all();for(const g of guests){if(!g.createdAt&&!g.lastContactDate){g.createdAt=localDate();await save(g)}}render()}
function openModal(){ $('overlay').classList.add('show');setTimeout(()=>$('name').focus(),100)}
function closeModal(){$('overlay').classList.remove('show');$('guestForm').reset();setNat('');$('guestId').value='';$('deleteBtn').style.display='none';$('formTitle').textContent='Add guest';$('yWrap').style.display='none'}
function editGuest(id){let g=guests.find(x=>x.id===id);if(!g)return;$('guestId').value=g.id;$('name').value=g.name;setNat(g.nationality);$('room').value=g.room||'';$('gtype').value=g.type||'';$('checkin').value=g.checkin||'';$('checkout').value=g.checkout;$('notes').value=g.notes||'';$('formTitle').textContent='Edit guest';$('yWrap').style.display='flex';$('talkedYesterday').checked=(g.contactHistory||[]).includes(yesterday())||g.lastContactDate===yesterday();$('deleteBtn').style.display='block';openModal()}
$('addBtn').onclick=()=>{closeModal();openModal()};$('closeModal').onclick=closeModal;$('cancelBtn').onclick=closeModal;
$('guestForm').onsubmit=async e=>{e.preventDefault();let id=$('guestId').value||crypto.randomUUID();let old=guests.find(g=>g.id===id)||{};if($('checkin').value&&$('checkout').value<$('checkin').value){toast('Check-out must be after check-in');return}let extra={};if(!old.createdAt)extra.createdAt=localDate();if($('yWrap').style.display!=='none'){const y=yesterday();let h=(old.contactHistory||[]).slice();if(old.lastContactDate&&!h.includes(old.lastContactDate))h.push(old.lastContactDate);h=h.filter(x=>x!==y);if($('talkedYesterday').checked)h.push(y);h.sort();extra.contactHistory=h;extra.lastContactDate=h.length?h[h.length-1]:null}
await save({...old,...extra,id,name:$('name').value.trim(),nationality:$('nationality').value.trim(),room:$('room').value.trim(),type:$('gtype').value,checkin:$('checkin').value,checkout:$('checkout').value,notes:$('notes').value.trim()});closeModal();await refresh();toast('Guest saved')};
$('deleteBtn').onclick=async()=>{let id=$('guestId').value;if(id&&confirm('Delete this guest permanently?')){await remove(id);closeModal();await refresh();toast('Guest deleted')}};
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
$('search').oninput=render;$('nationalityFilter').onchange=render;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}
$('backupBtn').onclick=()=>{let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),guests},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='guest-tracker-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('restoreBtn').onclick=()=> $('importFile').click();
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:data.guests;if(!Array.isArray(arr))throw Error();if(confirm('Import '+arr.length+' guest records? Existing records with matching IDs will be replaced.')){for(let g of arr)if(g.id&&g.name&&g.checkout)await save(g);await refresh();toast('Backup imported')}}catch{alert('This backup file could not be read.')}e.target.value=''};
(async()=>{try{db=await openDB();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){alert('Local database could not be opened. Please use Safari.')}})();
</script>
</body>
</html>
